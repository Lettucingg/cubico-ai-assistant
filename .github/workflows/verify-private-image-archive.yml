name: Verify private image archive
on:
  pull_request:
    paths:
      - 'app/services/image_archive.py'
      - 'app/tools/comprobantes.py'
      - 'app/api/whatsapp.py'
      - 'app/api/panel.py'
      - 'test_image_archive*.py'
      - 'test_inbound_visibility.py'
      - '.github/workflows/verify-private-image-archive.yml'
permissions:
  contents: read
jobs:
  image-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: sqlite://
      SESSION_DATABASE_URL: sqlite://
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test
      WHATSAPP_TOKEN: test
      WHATSAPP_PHONE_NUMBER_ID: test
      WHATSAPP_VERIFY_TOKEN: test
      PANEL_USUARIOS_JSON: '{}'
      CUBICO_NOTIFY_KEY: test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install pytest SQLAlchemy pydantic-settings python-dotenv fastapi httpx anthropic openai psycopg2-binary pywebpush apscheduler openpyxl mcp socksio
      - name: Compile changed Python
        run: python -m py_compile app/services/image_archive.py app/tools/comprobantes.py app/api/whatsapp.py app/api/panel.py
      - name: Storage, protected panel, reception and upload tests
        run: python -m pytest -q test_image_archive.py test_image_archive_integration.py test_inbound_visibility.py
