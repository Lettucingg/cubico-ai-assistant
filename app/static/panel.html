<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cubico — Panel de chats</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181c27;
      --surface2:  #1f2435;
      --border:    #2a2f42;
      --accent:    #3b82f6;
      --accent-dim:#1e3a5f;
      --alerta:    #ef4444;
      --alerta-dim:#3b1515;
      --warn:      #f59e0b;
      --warn-dim:  #3b2a0a;
      --ok:        #22c55e;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --bot-msg:   #1e3a5f;
      --user-msg:  #1a2235;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── LOGIN ─────────────────────────────────────────── */
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 48px;
      width: 360px;
    }
    .login-box .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.5px;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .login-box .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }
    .login-box label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.4px;
    }
    .login-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .15s;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-box button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 11px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .15s;
    }
    .login-box button:hover { opacity: .85; }
    .login-error {
      margin-top: 14px;
      font-size: 13px;
      color: var(--alerta);
      text-align: center;
      display: none;
    }

    /* ── SHELL ─────────────────────────────────────────── */
    #app { display: none; flex: 1; flex-direction: column; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-header {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 500;
      color: var(--accent);
    }
    .refresh-info {
      font-size: 12px;
      color: var(--muted);
    }
    #countdown { font-weight: 500; color: var(--text); }

    .filters {
      display: flex;
      gap: 8px;
    }
    .filter-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--text);
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 57px);
    }

    /* ── SIDEBAR ───────────────────────────────────────── */
    .sidebar {
      width: 340px;
      min-width: 280px;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title { font-size: 13px; font-weight: 600; color: var(--muted); }
    #total-count { font-size: 12px; color: var(--muted); }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-list::-webkit-scrollbar { width: 4px; }
    .chat-list::-webkit-scrollbar-track { background: transparent; }
    .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .chat-item {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background .1s;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .chat-item:hover { background: var(--surface2); }
    .chat-item.active { background: var(--accent-dim); border-left: 2px solid var(--accent); }

    .chat-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .chat-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .badges { display: flex; gap: 4px; flex-shrink: 0; }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge-alert  { background: var(--alerta-dim); color: var(--alerta); }
    .badge-warn   { background: var(--warn-dim); color: var(--warn); }
    .badge-ok     { background: #052e16; color: var(--ok); }

    .chat-phone {
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .chat-preview {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-preview.from-bot { color: #3b82f6aa; }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* ── CHAT PANEL ────────────────────────────────────── */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-panel-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .chat-panel-name { font-size: 16px; font-weight: 600; }
    .chat-panel-phone {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .chat-panel-badges { display: flex; gap: 6px; margin-left: auto; }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      background: var(--user-msg);
      border: 1px solid var(--border);
      align-self: flex-start;
      border-radius: 10px 10px 10px 2px;
    }
    .msg.bot {
      background: var(--bot-msg);
      border: 1px solid #1e3a5f;
      align-self: flex-end;
      border-radius: 10px 10px 2px 10px;
    }
    .msg-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 3px;
      letter-spacing: 0.4px;
    }
    .msg.bot .msg-label { text-align: right; color: #3b82f688; }

    .no-chat {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--muted);
    }
    .no-chat .icon { font-size: 40px; opacity: .3; }
    .no-chat p { font-size: 14px; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">cubico_panel</div>
    <div class="subtitle">Panel interno de conversaciones</div>
    <label>Usuario</label>
    <input id="inp-user" type="text" placeholder="cubico" autocomplete="username" />
    <label>Contraseña</label>
    <input id="inp-pass" type="password" placeholder="••••••••" autocomplete="current-password" />
    <button onclick="login()">Entrar</button>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-left">
      <span class="logo-header">cubico</span>
      <span class="refresh-info">Actualizando en <span id="countdown">30</span>s</span>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFiltro('todos', this)">Todos</button>
      <button class="filter-btn" onclick="setFiltro('alerta', this)">🔴 Atención</button>
      <button class="filter-btn" onclick="setFiltro('domicilio', this)">🟡 Domicilio</button>
      <button class="filter-btn" onclick="setFiltro('retiro', this)">📦 Retiro</button>
    </div>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Conversaciones</span>
        <span id="total-count"></span>
      </div>
      <div class="chat-list" id="chat-list"></div>
    </div>

    <div class="chat-panel" id="chat-panel">
      <div class="no-chat">
        <div class="icon">💬</div>
        <p>Selecciona una conversación para ver el historial</p>
      </div>
    </div>
  </div>
</div>

<script>
  let creds = null;
  let conversaciones = [];
  let filtroActivo = 'todos';
  let telefonoActivo = null;
  let countdownVal = 30;
  let countdownTimer = null;
  let refreshTimer = null;

  // ── LOGIN ──────────────────────────────────────────────
  document.getElementById('inp-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  async function login() {
    const user = document.getElementById('inp-user').value.trim();
    const pass = document.getElementById('inp-pass').value;
    if (!user || !pass) return;

    const b64 = btoa(`${user}:${pass}`);
    try {
      const r = await fetch('/panel/conversaciones', {
        headers: { 'Authorization': `Basic ${b64}` }
      });
      if (r.status === 401) {
        document.getElementById('login-error').style.display = 'block';
        return;
      }
      creds = b64;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      const data = await r.json();
      renderLista(data);
      iniciarRefresh();
    } catch(e) {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  // ── REFRESH ────────────────────────────────────────────
  function iniciarRefresh() {
    countdownVal = 30;
    clearInterval(countdownTimer);
    clearTimeout(refreshTimer);

    countdownTimer = setInterval(() => {
      countdownVal--;
      document.getElementById('countdown').textContent = countdownVal;
      if (countdownVal <= 0) {
        countdownVal = 30;
        cargarConversaciones();
      }
    }, 1000);
  }

  async function cargarConversaciones() {
    try {
      const r = await fetch('/panel/conversaciones', {
        headers: { 'Authorization': `Basic ${creds}` }
      });
      const data = await r.json();
      renderLista(data);
    } catch(e) {}
  }

  // ── FILTRO ─────────────────────────────────────────────
  function setFiltro(filtro, btn) {
    filtroActivo = filtro;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderLista(conversaciones);
  }

  // ── LISTA ──────────────────────────────────────────────
  function renderLista(data) {
    conversaciones = data;
    let lista = data;

    if (filtroActivo === 'alerta')    lista = data.filter(c => c.necesita_atencion_humana);
    if (filtroActivo === 'domicilio') lista = data.filter(c => c.solicitud_domicilio_pendiente);
    if (filtroActivo === 'retiro')    lista = data.filter(c => c.aviso_retiro_pendiente);

    // alertas primero
    lista = lista.sort((a, b) => {
      const pA = a.necesita_atencion_humana ? 2 : a.solicitud_domicilio_pendiente || a.aviso_retiro_pendiente ? 1 : 0;
      const pB = b.necesita_atencion_humana ? 2 : b.solicitud_domicilio_pendiente || b.aviso_retiro_pendiente ? 1 : 0;
      return pB - pA;
    });

    const container = document.getElementById('chat-list');
    document.getElementById('total-count').textContent = `${lista.length} chats`;

    if (!lista.length) {
      container.innerHTML = '<div class="empty-state">Sin conversaciones en este filtro</div>';
      return;
    }

    container.innerHTML = lista.map(c => {
      const nombre = c.nombre || 'Sin nombre';
      const preview = c.ultimo_mensaje
        ? (c.ultimo_mensaje.contenido || '').slice(0, 60)
        : 'Sin mensajes';
      const esBot = c.ultimo_mensaje?.rol === 'assistant';

      const badges = [
        c.necesita_atencion_humana      ? '<span class="badge badge-alert">⚠ Atención</span>' : '',
        c.solicitud_domicilio_pendiente ? '<span class="badge badge-warn">🏠 Domicilio</span>' : '',
        c.aviso_retiro_pendiente        ? '<span class="badge badge-warn">📦 Retiro</span>' : '',
      ].filter(Boolean).join('');

      return `
        <div class="chat-item${c.telefono === telefonoActivo ? ' active' : ''}"
             onclick="abrirChat('${c.telefono}')">
          <div class="chat-top">
            <span class="chat-name">${nombre}</span>
            <div class="badges">${badges}</div>
          </div>
          <span class="chat-phone">${c.telefono}</span>
          <span class="chat-preview${esBot ? ' from-bot' : ''}">${esBot ? '🤖 ' : ''}${preview}</span>
        </div>`;
    }).join('');
  }

  // ── HISTORIAL ──────────────────────────────────────────
  async function abrirChat(telefono) {
    telefonoActivo = telefono;
    // resalta activo en lista
    document.querySelectorAll('.chat-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('onclick').includes(telefono));
    });

    const conv = conversaciones.find(c => c.telefono === telefono);
    const panel = document.getElementById('chat-panel');

    panel.innerHTML = `
      <div class="chat-panel-header">
        <div>
          <div class="chat-panel-name">${conv?.nombre || 'Sin nombre'}</div>
          <div class="chat-panel-phone">${telefono}</div>
        </div>
        <div class="chat-panel-badges">
          ${conv?.necesita_atencion_humana      ? '<span class="badge badge-alert">⚠ Necesita atención</span>' : ''}
          ${conv?.solicitud_domicilio_pendiente ? '<span class="badge badge-warn">🏠 Domicilio pendiente</span>' : ''}
          ${conv?.aviso_retiro_pendiente        ? '<span class="badge badge-warn">📦 Retiro pendiente</span>' : ''}
          ${(!conv?.necesita_atencion_humana && !conv?.solicitud_domicilio_pendiente && !conv?.aviso_retiro_pendiente)
            ? '<span class="badge badge-ok">✓ Sin alertas</span>' : ''}
        </div>
      </div>
      <div class="messages" id="messages-container">
        <div style="color:var(--muted);font-size:13px;text-align:center">Cargando...</div>
      </div>`;

    try {
      const r = await fetch(`/panel/conversacion/${telefono}`, {
        headers: { 'Authorization': `Basic ${creds}` }
      });
      const data = await r.json();
      const container = document.getElementById('messages-container');

      if (!data.historial || !data.historial.length) {
        container.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center">Sin mensajes en el historial</div>';
        return;
      }

      container.innerHTML = data.historial.map(m => {
        const esBot = m.role === 'assistant';
        const contenido = Array.isArray(m.content)
          ? m.content.map(b => b.text || b.content || '').join('\n')
          : (m.content || '');
        return `
          <div class="msg ${esBot ? 'bot' : 'user'}">
            <div class="msg-label">${esBot ? 'Bot' : 'Cliente'}</div>
            ${escHTML(contenido)}
          </div>`;
      }).join('');

      container.scrollTop = container.scrollHeight;
    } catch(e) {
      document.getElementById('messages-container').innerHTML =
        '<div style="color:var(--alerta);font-size:13px;text-align:center">Error cargando el historial</div>';
    }
  }

  function escHTML(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
