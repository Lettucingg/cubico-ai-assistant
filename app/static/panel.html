<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cúbico · Panel de operaciones</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c12;
  --s1:#0d1220;
  --s2:#111827;
  --s3:#1a2235;
  --border:#1e2d45;
  --border2:#243352;
  --accent:#2563eb;
  --accent-h:#1d4ed8;
  --accent-dim:#0f2040;
  --alerta:#ef4444;
  --alerta-dim:#2a0a0a;
  --warn:#f59e0b;
  --warn-dim:#2a1a00;
  --ok:#22c55e;
  --ok-dim:#052e16;
  --text:#e2e8f0;
  --text2:#94a3b8;
  --text3:#475569;
  --bot:#1a2f55;
  --user:#0f1c30;
  --r:8px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.lbox{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:44px 48px;width:380px}
.llogo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.llogo-mark{width:32px;height:32px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;color:#fff}
.llogo-name{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:500;color:var(--text);letter-spacing:-0.3px}
.llogo-name span{color:var(--text2);font-weight:400}
.ltitle{font-size:13px;color:var(--text2);margin-bottom:28px;line-height:1.5}
.lfield{margin-bottom:16px}
.lfield label{display:block;font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.lfield input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:10px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.lfield input:focus{border-color:var(--accent)}
.lbtn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:11px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;margin-top:4px}
.lbtn:hover{background:var(--accent-h)}
.lerr{margin-top:12px;font-size:12px;color:var(--alerta);text-align:center;display:none}

/* SHELL */
#app{display:none;flex-direction:column;height:100%}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{display:flex;align-items:center;gap:8px}
.topbar-mark{width:26px;height:26px;background:var(--accent);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#fff}
.topbar-name{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:500;color:var(--text)}
.topbar-sep{width:1px;height:20px;background:var(--border2)}
.topbar-sub{font-size:12px;color:var(--text3)}
.topbar-right{display:flex;align-items:center;gap:8px}
.refresh-pill{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--text3)}
.refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#countdown{color:var(--text2);font-weight:500}

/* FILTROS */
.filterbar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0}
.fbtn{background:transparent;border:1px solid var(--border2);color:var(--text3);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:var(--accent);color:var(--text)}
.fbtn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.fcount{margin-left:auto;font-size:11px;color:var(--text3)}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:320px;min-width:260px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--s1)}
.clist{flex:1;overflow-y:auto}
.clist::-webkit-scrollbar{width:3px}
.clist::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.citem{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.citem:hover{background:var(--s2)}
.citem.on{background:var(--accent-dim);border-left:2px solid var(--accent)}
.citem-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:3px}
.citem-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.citem-badges{display:flex;gap:3px;flex-shrink:0}
.badge{font-size:9px;font-weight:600;padding:2px 5px;border-radius:3px}
.ba{background:var(--alerta-dim);color:var(--alerta)}
.bw{background:var(--warn-dim);color:var(--warn)}
.bg{background:var(--ok-dim);color:var(--ok)}
.citem-phone{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-bottom:4px}
.citem-preview{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem-preview.bot{color:#3b82f680}

.empty{padding:32px 20px;text-align:center;color:var(--text3);font-size:12px}

/* CHAT */
.chatpanel{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

.nosel{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--text3)}
.nosel-icon{font-size:32px;opacity:.2}
.nosel-txt{font-size:13px}

.chatheader{padding:12px 20px;border-bottom:1px solid var(--border);background:var(--s1);display:flex;align-items:center;gap:12px;flex-shrink:0}
.chatheader-info{flex:1;min-width:0}
.chatheader-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatheader-phone{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.chatheader-badges{display:flex;gap:6px;flex-wrap:wrap}
.btn-atender{background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok);border-radius:6px;padding:5px 12px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.btn-atender:hover{background:var(--ok);color:#fff}

.msgs{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.msg{max-width:72%;padding:9px 13px;border-radius:8px;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg-meta{font-size:9px;font-weight:500;color:var(--text3);margin-bottom:3px;letter-spacing:.3px}
.msg.user{background:var(--user);border:1px solid var(--border);align-self:flex-start;border-radius:8px 8px 8px 2px}
.msg.bot{background:var(--bot);border:1px solid #1a3060;align-self:flex-end;border-radius:8px 8px 2px 8px}
.msg.bot .msg-meta{text-align:right;color:#3b82f660}

/* RESPONDER */
.replybar{padding:12px 16px;border-top:1px solid var(--border);background:var(--s1);flex-shrink:0}
.replybar-label{font-size:10px;font-weight:500;color:var(--text3);letter-spacing:.4px;text-transform:uppercase;margin-bottom:7px}
.replybar-row{display:flex;gap:8px;align-items:flex-end}
.replybar textarea{flex:1;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;resize:none;outline:none;min-height:40px;max-height:100px;transition:border-color .15s;line-height:1.5}
.replybar textarea:focus{border-color:var(--accent)}
.replybar-btns{display:flex;flex-direction:column;gap:6px}
.btn-send{background:var(--accent);color:#fff;border:none;border-radius:var(--r);padding:9px 16px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:background .15s}
.btn-send:hover{background:var(--accent-h)}
.btn-send:disabled{opacity:.4;cursor:default}
.btn-bot{background:var(--s3);border:1px solid var(--border2);color:var(--text2);border-radius:var(--r);padding:9px 16px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s}
.btn-bot:hover{border-color:var(--accent);color:var(--text)}
.reply-status{font-size:11px;color:var(--text3);margin-top:5px;min-height:16px}
.reply-status.ok{color:var(--ok)}
.reply-status.err{color:var(--alerta)}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="llogo">
      <div class="llogo-mark">C²</div>
      <div class="llogo-name">cúbico <span>· panel</span></div>
    </div>
    <div class="ltitle">Acceso interno — operaciones y soporte al cliente</div>
    <div class="lfield"><label>Usuario</label><input id="u" type="text" placeholder="cubico" autocomplete="username"/></div>
    <div class="lfield"><label>Contraseña</label><input id="p" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="lbtn" onclick="login()">Entrar</button>
    <div class="lerr" id="lerr">Credenciales incorrectas</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <div class="topbar-mark">C²</div>
        <div class="topbar-name">cúbico</div>
      </div>
      <div class="topbar-sep"></div>
      <div class="topbar-sub">Panel de operaciones</div>
    </div>
    <div class="topbar-right">
      <div class="refresh-pill">
        <div class="refresh-dot"></div>
        Actualizando en <span id="countdown">30</span>s
      </div>
    </div>
  </div>

  <div class="filterbar">
    <button class="fbtn on" onclick="setF('todos',this)">Todos</button>
    <button class="fbtn" onclick="setF('alerta',this)">⚠ Atención</button>
    <button class="fbtn" onclick="setF('domicilio',this)">🏠 Domicilio</button>
    <button class="fbtn" onclick="setF('retiro',this)">📦 Retiro</button>
    <span class="fcount" id="fcount"></span>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="clist" id="clist"></div>
    </div>
    <div class="chatpanel" id="chatpanel">
      <div class="nosel">
        <div class="nosel-icon">💬</div>
        <div class="nosel-txt">Selecciona una conversación</div>
      </div>
    </div>
  </div>
</div>

<script>
let creds=null, convs=[], filtro='todos', telActivo=null, cd=30, timer=null;

document.getElementById('p').onkeydown=e=>{if(e.key==='Enter')login()};
document.getElementById('u').onkeydown=e=>{if(e.key==='Enter')document.getElementById('p').focus()};

async function login(){
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  if(!u||!p)return;
  const b=btoa(u+':'+p);
  try{
    const r=await fetch('/panel/conversaciones',{headers:{'Authorization':'Basic '+b}});
    if(r.status===401){document.getElementById('lerr').style.display='block';return;}
    creds=b;
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='flex';
    renderLista(await r.json());
    iniciarCD();
  }catch(e){document.getElementById('lerr').style.display='block';}
}

function iniciarCD(){
  cd=30;clearInterval(timer);
  timer=setInterval(()=>{
    cd--;document.getElementById('countdown').textContent=cd;
    if(cd<=0){cd=30;recargar();}
  },1000);
}

async function recargar(){
  try{
    const r=await fetch('/panel/conversaciones',{headers:{'Authorization':'Basic '+creds}});
    renderLista(await r.json());
  }catch(e){}
}

function setF(f,btn){
  filtro=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderLista(convs);
}

function renderLista(data){
  convs=data;
  let lista=[...data];
  if(filtro==='alerta')   lista=lista.filter(c=>c.necesita_atencion_humana);
  if(filtro==='domicilio')lista=lista.filter(c=>c.solicitud_domicilio_pendiente);
  if(filtro==='retiro')   lista=lista.filter(c=>c.aviso_retiro_pendiente);
  lista.sort((a,b)=>{
    const pa=a.necesita_atencion_humana?2:(a.solicitud_domicilio_pendiente||a.aviso_retiro_pendiente)?1:0;
    const pb=b.necesita_atencion_humana?2:(b.solicitud_domicilio_pendiente||b.aviso_retiro_pendiente)?1:0;
    return pb-pa;
  });
  document.getElementById('fcount').textContent=lista.length+' conversaciones';
  const el=document.getElementById('clist');
  if(!lista.length){el.innerHTML='<div class="empty">Sin resultados para este filtro</div>';return;}
  el.innerHTML=lista.map(c=>{
    const nom=c.nombre||'Sin nombre';
    const prev=c.ultimo_mensaje?(c.ultimo_mensaje.contenido||'').slice(0,55):'—';
    const esBot=c.ultimo_mensaje?.rol==='assistant';
    const badges=[
      c.necesita_atencion_humana?'<span class="badge ba">⚠ Atención</span>':'',
      c.solicitud_domicilio_pendiente?'<span class="badge bw">🏠 Domicilio</span>':'',
      c.aviso_retiro_pendiente?'<span class="badge bw">📦 Retiro</span>':'',
    ].filter(Boolean).join('');
    return`<div class="citem${c.telefono===telActivo?' on':''}" onclick="abrirChat('${c.telefono}')">
      <div class="citem-top"><span class="citem-name">${esc(nom)}</span><div class="citem-badges">${badges}</div></div>
      <div class="citem-phone">${c.telefono}</div>
      <div class="citem-preview${esBot?' bot':''}">${esBot?'🤖 ':''}${esc(prev)}</div>
    </div>`;
  }).join('');
}

async function abrirChat(tel){
  telActivo=tel;
  document.querySelectorAll('.citem').forEach(e=>e.classList.toggle('on',e.onclick.toString().includes(`'${tel}'`)));
  const conv=convs.find(c=>c.telefono===tel);
  const panel=document.getElementById('chatpanel');

  const alertBadges=[
    conv?.necesita_atencion_humana?'<span class="badge ba">⚠ Necesita atención</span>':'',
    conv?.solicitud_domicilio_pendiente?'<span class="badge bw">🏠 Domicilio pendiente</span>':'',
    conv?.aviso_retiro_pendiente?'<span class="badge bw">📦 Retiro pendiente</span>':'',
    (!conv?.necesita_atencion_humana&&!conv?.solicitud_domicilio_pendiente&&!conv?.aviso_retiro_pendiente)?'<span class="badge bg">✓ Sin alertas</span>':'',
  ].filter(Boolean).join('');

  const btnAtender=conv?.necesita_atencion_humana
    ?`<button class="btn-atender" onclick="marcarAtendido('${tel}')">✓ Marcar atendido</button>`:'';

  panel.innerHTML=`
    <div class="chatheader">
      <div class="chatheader-info">
        <div class="chatheader-name">${esc(conv?.nombre||'Sin nombre')}</div>
        <div class="chatheader-phone">${tel}</div>
      </div>
      <div class="chatheader-badges">${alertBadges}</div>
      ${btnAtender}
    </div>
    <div class="msgs" id="msgs"><div style="color:var(--text3);font-size:12px;text-align:center;padding:20px">Cargando...</div></div>
    <div class="replybar">
      <div class="replybar-label">Responder al cliente</div>
      <div class="replybar-row">
        <textarea id="reply-input" placeholder="Escribe la respuesta — Bruno la redacta y la envía por WhatsApp..." rows="2"></textarea>
        <div class="replybar-btns">
          <button class="btn-send" id="btn-send" onclick="enviarRespuesta('${tel}')">Enviar</button>
        </div>
      </div>
      <div class="reply-status" id="reply-status"></div>
    </div>`;

  // Enter para enviar, Shift+Enter para salto de línea
  document.getElementById('reply-input').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviarRespuesta(tel);}
  });

  try{
    const r=await fetch(`/panel/conversacion/${tel}`,{headers:{'Authorization':'Basic '+creds}});
    const data=await r.json();
    const cont=document.getElementById('msgs');
    if(!data.historial||!data.historial.length){
      cont.innerHTML='<div style="color:var(--text3);font-size:12px;text-align:center;padding:20px">Sin historial</div>';
      return;
    }
    cont.innerHTML=data.historial.map(m=>{
      const esBot=m.role==='assistant';
      const txt=Array.isArray(m.content)?m.content.map(b=>b.text||b.content||'').join('\n'):(m.content||'');
      return`<div class="msg ${esBot?'bot':'user'}">
        <div class="msg-meta">${esBot?'Bot · Cúbico':'Cliente'}</div>
        ${esc(txt)}
      </div>`;
    }).join('');
    cont.scrollTop=cont.scrollHeight;
  }catch(e){
    document.getElementById('msgs').innerHTML='<div style="color:var(--alerta);font-size:12px;text-align:center;padding:20px">Error cargando historial</div>';
  }
}

async function enviarRespuesta(tel){
  const inp=document.getElementById('reply-input');
  const msg=inp.value.trim();
  if(!msg)return;
  const btn=document.getElementById('btn-send');
  const status=document.getElementById('reply-status');
  btn.disabled=true;
  status.className='reply-status';
  status.textContent='Enviando...';
  try{
    const r=await fetch(`/panel/responder/${tel}`,{
      method:'POST',
      headers:{'Authorization':'Basic '+creds,'Content-Type':'application/json'},
      body:JSON.stringify({mensaje:msg})
    });
    if(r.ok){
      inp.value='';
      status.className='reply-status ok';
      status.textContent='✓ Respuesta enviada — Bruno la redactó y la envió al cliente';
      recargar();
    }else{
      status.className='reply-status err';
      status.textContent='Error al enviar. Intenta de nuevo.';
    }
  }catch(e){
    status.className='reply-status err';
    status.textContent='Error de conexión.';
  }
  btn.disabled=false;
}

async function marcarAtendido(tel){
  try{
    await fetch(`/panel/atender/${tel}`,{method:'POST',headers:{'Authorization':'Basic '+creds}});
    await recargar();
    abrirChat(tel);
  }catch(e){}
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
