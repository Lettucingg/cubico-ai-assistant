<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cúbico · Operaciones</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;
  --s1:#0e0e0e;
  --s2:#141414;
  --s3:#1a1a1a;
  --border:#222;
  --border2:#2a2a2a;
  --gold:#c9a84c;
  --gold2:#e8c97a;
  --gold-dim:#1a1408;
  --gold-border:#2d2210;
  --alerta:#c0392b;
  --alerta-dim:#1a0806;
  --warn:#b8860b;
  --warn-dim:#1a1200;
  --ok:#2e7d52;
  --ok-dim:#0a1f12;
  --text:#f0ead6;
  --text2:#8a7d5a;
  --text3:#4a4030;
  --bot:#0f1208;
  --user:#0e0e12;
  --r:4px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* LOGIN */
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
.lbox{width:400px;padding:56px 52px;border:1px solid var(--border2);background:var(--s1);position:relative}
.lbox::before{content:'';position:absolute;top:0;left:52px;right:52px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.lmark{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:300;color:var(--gold);letter-spacing:4px;text-align:center;margin-bottom:4px}
.lsub{font-size:10px;letter-spacing:4px;color:var(--text3);text-align:center;text-transform:uppercase;margin-bottom:44px}
.lfield{margin-bottom:20px}
.lfield label{display:block;font-size:10px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;margin-bottom:8px}
.lfield input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border2);padding:8px 0;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.lfield input:focus{border-bottom-color:var(--gold)}
.lbtn{width:100%;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:13px;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;margin-top:12px;transition:all .2s}
.lbtn:hover{background:var(--gold);color:var(--bg)}
.lerr{margin-top:14px;font-size:11px;color:var(--alerta);text-align:center;display:none;letter-spacing:.5px}

/* SHELL */
#app{display:none;flex-direction:column;height:100%}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:56px;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;position:relative}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border),transparent)}
.topbar-brand{display:flex;align-items:baseline;gap:10px}
.topbar-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--gold);letter-spacing:3px}
.topbar-panel{font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:16px}
.refresh-pill{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text3);letter-spacing:.5px}
.refresh-dot{width:5px;height:5px;border-radius:50%;background:var(--ok);animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
#countdown{color:var(--text2)}

/* FILTROS */
.filterbar{display:flex;align-items:center;gap:4px;padding:10px 20px;border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0}
.fbtn{background:transparent;border:1px solid transparent;color:var(--text3);padding:5px 14px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.fbtn:hover{color:var(--text2);border-color:var(--border2)}
.fbtn.on{border-color:var(--gold-border);color:var(--gold);background:var(--gold-dim)}
.fcount{margin-left:auto;font-size:10px;color:var(--text3);letter-spacing:1px}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
.sidebar{width:310px;min-width:260px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--s1)}
.clist{flex:1;overflow-y:auto}
.clist::-webkit-scrollbar{width:2px}
.clist::-webkit-scrollbar-thumb{background:var(--border2)}

.citem{padding:14px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
.citem:hover{background:var(--s2)}
.citem.on{background:var(--gold-dim);border-left:1px solid var(--gold)}
.citem-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:3px}
.citem-name{font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--text)}
.citem-badges{display:flex;gap:3px;flex-shrink:0}
.badge{font-size:9px;font-weight:500;padding:2px 6px;letter-spacing:.5px}
.ba{background:var(--alerta-dim);color:var(--alerta);border:1px solid #3a0a08}
.bw{background:var(--warn-dim);color:var(--warn);border:1px solid #2a2000}
.bg{background:var(--ok-dim);color:var(--ok);border:1px solid #0a2a18}
.citem-phone{font-size:10px;color:var(--text3);font-family:monospace;margin-bottom:5px;letter-spacing:.5px}
.citem-preview{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem-preview.bot{color:#8a7d5a88}
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:11px;letter-spacing:1px}

/* CHAT */
.chatpanel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.nosel{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text3)}
.nosel-icon{font-size:28px;opacity:.15}
.nosel-txt{font-size:11px;letter-spacing:2px;text-transform:uppercase}

.chatheader{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--s1);display:flex;align-items:center;gap:16px;flex-shrink:0;position:relative}
.chatheader::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border),transparent)}
.chatheader-info{flex:1;min-width:0}
.chatheader-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--text);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatheader-phone{font-size:10px;color:var(--text3);font-family:monospace;letter-spacing:1px;margin-top:1px}
.chatheader-badges{display:flex;gap:6px;flex-wrap:wrap}
.btn-atender{background:transparent;border:1px solid var(--ok);color:var(--ok);padding:5px 14px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
.btn-atender:hover{background:var(--ok);color:#fff}

.msgs{flex:1;overflow-y:auto;padding:20px 28px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msgs::-webkit-scrollbar{width:2px}
.msgs::-webkit-scrollbar-thumb{background:var(--border2)}

.msg{max-width:68%;padding:10px 14px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg-meta{font-size:9px;color:var(--text3);margin-bottom:4px;letter-spacing:.8px;text-transform:uppercase}
.msg.user{background:var(--user);border:1px solid var(--border);align-self:flex-start;border-radius:0 4px 4px 4px}
.msg.bot{background:var(--bot);border:1px solid var(--border);align-self:flex-end;border-radius:4px 0 4px 4px;border-left:1px solid var(--gold-border)}
.msg.bot .msg-meta{text-align:right;color:var(--gold);opacity:.5}

/* RESPONDER */
.replybar{padding:14px 20px;border-top:1px solid var(--border);background:var(--s1);flex-shrink:0;position:relative}
.replybar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border),transparent)}
.replybar-label{font-size:9px;letter-spacing:2.5px;color:var(--text3);text-transform:uppercase;margin-bottom:10px}
.replybar-row{display:flex;gap:10px;align-items:flex-end}
.replybar textarea{flex:1;background:transparent;border:none;border-bottom:1px solid var(--border2);padding:6px 0;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;resize:none;outline:none;min-height:36px;max-height:90px;line-height:1.5;transition:border-color .2s}
.replybar textarea:focus{border-bottom-color:var(--gold)}
.replybar-btns{display:flex;gap:6px}
.btn-send{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:8px 18px;font-size:10px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap}
.btn-send:hover{background:var(--gold);color:var(--bg)}
.btn-send:disabled{opacity:.3;cursor:default}
.reply-status{font-size:10px;color:var(--text3);margin-top:7px;min-height:14px;letter-spacing:.5px}
.reply-status.ok{color:var(--ok)}
.reply-status.err{color:var(--alerta)}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="lmark">CÚBICO</div>
    <div class="lsub">Panel de operaciones</div>
    <div class="lfield"><label>Usuario</label><input id="u" type="text" placeholder="cubico" autocomplete="username"/></div>
    <div class="lfield"><label>Contraseña</label><input id="p" type="password" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="lbtn" onclick="login()">Acceder</button>
    <div class="lerr" id="lerr">Credenciales incorrectas</div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <span class="topbar-name">CÚBICO</span>
      <span class="topbar-panel">Operaciones</span>
    </div>
    <div class="topbar-right">
      <div class="refresh-pill">
        <div class="refresh-dot"></div>
        Actualizando en <span id="countdown">30</span>s
      </div>
    </div>
  </div>

  <div class="filterbar">
    <button class="fbtn on" onclick="setF('todos',this)">Todos</button>
    <button class="fbtn" onclick="setF('alerta',this)">⚠ Atención</button>
    <button class="fbtn" onclick="setF('domicilio',this)">Domicilio</button>
    <button class="fbtn" onclick="setF('retiro',this)">Retiro</button>
    <span class="fcount" id="fcount"></span>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="clist" id="clist"></div>
    </div>
    <div class="chatpanel" id="chatpanel">
      <div class="nosel">
        <div class="nosel-icon">◈</div>
        <div class="nosel-txt">Selecciona una conversación</div>
      </div>
    </div>
  </div>
</div>

<script>
let creds=null,convs=[],filtro='todos',telActivo=null,cd=30,timer=null;
document.getElementById('p').onkeydown=e=>{if(e.key==='Enter')login()};
document.getElementById('u').onkeydown=e=>{if(e.key==='Enter')document.getElementById('p').focus()};

async function login(){
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  if(!u||!p)return;
  const b=btoa(u+':'+p);
  try{
    const r=await fetch('/panel/conversaciones',{headers:{'Authorization':'Basic '+b}});
    if(r.status===401){document.getElementById('lerr').style.display='block';return;}
    creds=b;
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='flex';
    renderLista(await r.json());
    iniciarCD();
  }catch(e){document.getElementById('lerr').style.display='block';}
}

function iniciarCD(){
  cd=30;clearInterval(timer);
  timer=setInterval(()=>{
    cd--;document.getElementById('countdown').textContent=cd;
    if(cd<=0){cd=30;recargar();}
  },1000);
}

async function recargar(){
  try{
    const r=await fetch('/panel/conversaciones',{headers:{'Authorization':'Basic '+creds}});
    renderLista(await r.json());
  }catch(e){}
}

function setF(f,btn){
  filtro=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderLista(convs);
}

function renderLista(data){
  convs=data;
  let lista=[...data];
  if(filtro==='alerta')   lista=lista.filter(c=>c.necesita_atencion_humana);
  if(filtro==='domicilio')lista=lista.filter(c=>c.solicitud_domicilio_pendiente);
  if(filtro==='retiro')   lista=lista.filter(c=>c.aviso_retiro_pendiente);
  lista.sort((a,b)=>{
    const pa=a.necesita_atencion_humana?2:(a.solicitud_domicilio_pendiente||a.aviso_retiro_pendiente)?1:0;
    const pb=b.necesita_atencion_humana?2:(b.solicitud_domicilio_pendiente||b.aviso_retiro_pendiente)?1:0;
    return pb-pa;
  });
  document.getElementById('fcount').textContent=lista.length+' conversaciones';
  const el=document.getElementById('clist');
  if(!lista.length){el.innerHTML='<div class="empty">Sin resultados</div>';return;}
  el.innerHTML=lista.map(c=>{
    const nom=c.nombre||'Sin nombre';
    const prev=c.ultimo_mensaje?(c.ultimo_mensaje.contenido||'').slice(0,55):'—';
    const esBot=c.ultimo_mensaje?.rol==='assistant';
    const badges=[
      c.necesita_atencion_humana?'<span class="badge ba">Atención</span>':'',
      c.solicitud_domicilio_pendiente?'<span class="badge bw">Domicilio</span>':'',
      c.aviso_retiro_pendiente?'<span class="badge bw">Retiro</span>':'',
    ].filter(Boolean).join('');
    return`<div class="citem${c.telefono===telActivo?' on':''}" onclick="abrirChat('${c.telefono}')">
      <div class="citem-top"><span class="citem-name">${esc(nom)}</span><div class="citem-badges">${badges}</div></div>
      <div class="citem-phone">${c.telefono}</div>
      <div class="citem-preview${esBot?' bot':''}">${esc(prev)}</div>
    </div>`;
  }).join('');
}

async function abrirChat(tel){
  telActivo=tel;
  document.querySelectorAll('.citem').forEach(e=>e.classList.toggle('on',e.getAttribute('onclick').includes(`'${tel}'`)));
  const conv=convs.find(c=>c.telefono===tel);
  const panel=document.getElementById('chatpanel');
  const alertBadges=[
    conv?.necesita_atencion_humana?'<span class="badge ba">Atención requerida</span>':'',
    conv?.solicitud_domicilio_pendiente?'<span class="badge bw">Domicilio pendiente</span>':'',
    conv?.aviso_retiro_pendiente?'<span class="badge bw">Retiro pendiente</span>':'',
    (!conv?.necesita_atencion_humana&&!conv?.solicitud_domicilio_pendiente&&!conv?.aviso_retiro_pendiente)?'<span class="badge bg">Sin alertas</span>':'',
  ].filter(Boolean).join('');
  const btnAtender=conv?.necesita_atencion_humana
    ?`<button class="btn-atender" onclick="marcarAtendido('${tel}')">✓ Marcar atendido</button>`:'';
  panel.innerHTML=`
    <div class="chatheader">
      <div class="chatheader-info">
        <div class="chatheader-name">${esc(conv?.nombre||'Sin nombre')}</div>
        <div class="chatheader-phone">${tel}</div>
      </div>
      <div class="chatheader-badges">${alertBadges}</div>
      ${btnAtender}
    </div>
    <div class="msgs" id="msgs"><div style="color:var(--text3);font-size:11px;text-align:center;padding:30px;letter-spacing:1px">Cargando historial...</div></div>
    <div class="replybar">
      <div class="replybar-label">Responder al cliente</div>
      <div class="replybar-row">
        <textarea id="reply-input" placeholder="Escribe la solución — Bruno la redacta y envía por WhatsApp..." rows="2"></textarea>
        <div class="replybar-btns">
          <button class="btn-send" id="btn-send" onclick="enviarRespuesta('${tel}')">Enviar</button>
        </div>
      </div>
      <div class="reply-status" id="reply-status"></div>
    </div>`;
  document.getElementById('reply-input').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviarRespuesta(tel);}
  });
  try{
    const r=await fetch(`/panel/conversacion/${tel}`,{headers:{'Authorization':'Basic '+creds}});
    const data=await r.json();
    const cont=document.getElementById('msgs');
    if(!data.historial||!data.historial.length){
      cont.innerHTML='<div style="color:var(--text3);font-size:11px;text-align:center;padding:30px;letter-spacing:1px">Sin historial registrado</div>';
      return;
    }
    cont.innerHTML=data.historial.map(m=>{
      const esBot=m.role==='assistant';
      const txt=Array.isArray(m.content)?m.content.map(b=>b.text||b.content||'').join('\n'):(m.content||'');
      return`<div class="msg ${esBot?'bot':'user'}">
        <div class="msg-meta">${esBot?'Cúbico · Bot':'Cliente'}</div>
        ${esc(txt)}
      </div>`;
    }).join('');
    cont.scrollTop=cont.scrollHeight;
  }catch(e){
    document.getElementById('msgs').innerHTML='<div style="color:var(--alerta);font-size:11px;text-align:center;padding:30px">Error al cargar el historial</div>';
  }
}

async function enviarRespuesta(tel){
  const inp=document.getElementById('reply-input');
  const msg=inp.value.trim();
  if(!msg)return;
  const btn=document.getElementById('btn-send');
  const status=document.getElementById('reply-status');
  btn.disabled=true;
  status.className='reply-status';
  status.textContent='Enviando...';
  try{
    const r=await fetch(`/panel/responder/${tel}`,{
      method:'POST',
      headers:{'Authorization':'Basic '+creds,'Content-Type':'application/json'},
      body:JSON.stringify({mensaje:msg})
    });
    if(r.ok){
      inp.value='';
      status.className='reply-status ok';
      status.textContent='Respuesta enviada — Bruno la redactó y la entregó al cliente';
      recargar();
    }else{
      status.className='reply-status err';
      status.textContent='Error al enviar. Intenta de nuevo.';
    }
  }catch(e){
    status.className='reply-status err';
    status.textContent='Error de conexión.';
  }
  btn.disabled=false;
}

async function marcarAtendido(tel){
  try{
    await fetch(`/panel/atender/${tel}`,{method:'POST',headers:{'Authorization':'Basic '+creds}});
    await recargar();
    abrirChat(tel);
  }catch(e){}
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
